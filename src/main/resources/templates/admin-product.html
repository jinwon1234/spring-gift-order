<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>나의 상품 관리</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $.ajaxSetup({ xhrFields: { withCredentials: true } });

        function getQueryParam(name, defaultValue) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name) || defaultValue;
        }

        $(document).ready(function () {
            let currentPage = parseInt(getQueryParam('page', 0));
            const size = parseInt(getQueryParam('size', 10));
            const sort = getQueryParam('sort', 'id,asc');

            $('#sortKey').val(sort.split(',')[0]);
            $('#sortDir').val(sort.split(',')[1]);

            $('#sortKey, #sortDir').on('change', function () {
                const newSortKey = $('#sortKey').val();
                const newSortDir = $('#sortDir').val();

                const newUrl = new URL(window.location.href);
                newUrl.searchParams.set('page', 0);
                newUrl.searchParams.set('size', size);
                newUrl.searchParams.set('sort', `${newSortKey},${newSortDir}`);

                window.location.href = newUrl.toString();
            });

            function fetchProducts(page = 0) {
                $.ajax({
                    url: `/api/products/mine?page=${page}&size=${size}&sort=${sort}`,
                    method: 'GET',
                    success: function (data) {
                        const products = data.content;
                        const totalPages = data.page.totalPages;
                        currentPage = data.page.number;

                        let html = `
                            <table class="table table-striped table-hover mt-4 align-middle text-center">
                                <thead class="table-dark">
                                    <tr>
                                        <th>이름</th>
                                        <th>가격</th>
                                        <th>이미지</th>
                                        <th>옵션 총수량</th>
                                        <th>옵션 선택</th>
                                        <th>선택 옵션 수량</th>
                                        <th>수정</th>
                                        <th>제거</th>
                                    </tr>
                                </thead>
                                <tbody>`;

                        for (const product of products) {
                            const options = product.options ?? [];
                            const totalQuantity = options.reduce((sum, o) => sum + o.quantity, 0);
                            const selectId = `select-${product.id}`;
                            const quantityId = `quantity-${product.id}`;

                            if (options.length === 0) {
                                html += `
                                    <tr>
                                        <td>${product.name}</td>
                                        <td>${product.price.toLocaleString()}원</td>
                                        <td><img src="${product.imageURL}" width="60" height="60" class="rounded shadow-sm"></td>
                                        <td>-</td>
                                        <td colspan="2" class="text-muted">옵션 없음</td>
                                        <td>
                                            <div class="d-grid gap-1">
                                                <button class="btn btn-warning btn-sm editBtn" data-id="${product.id}">상품</button>
                                            </div>
                                        </td>
                                        <td>
                                            <button class="btn btn-danger btn-sm deleteBtn" data-id="${product.id}">삭제</button>
                                        </td>
                                    </tr>`;
                            } else {
                                const optionSelectHTML = options.map(opt =>
                                    `<option value="${opt.quantity}">${opt.name}</option>`
                                ).join('');

                                html += `
                                    <tr>
                                        <td>${product.name}</td>
                                        <td>${product.price.toLocaleString()}원</td>
                                        <td><img src="${product.imageURL}" width="60" height="60" class="rounded shadow-sm"></td>
                                        <td>${totalQuantity}</td>
                                        <td>
                                            <select class="form-select optionSelect" id="${selectId}" data-target="${quantityId}">
                                                ${optionSelectHTML}
                                            </select>
                                        </td>
                                        <td id="${quantityId}">${options[0].quantity}</td>
                                        <td>
                                            <div class="d-flex flex-column gap-1">
                                                <button class="btn btn-warning btn-sm editBtn" data-id="${product.id}">상품</button>
                                                <button class="btn btn-outline-primary btn-sm optionBtn" data-id="${product.id}">옵션</button>
                                            </div>
                                        </td>
                                        <td>
                                            <button class="btn btn-danger btn-sm deleteBtn" data-id="${product.id}">삭제</button>
                                        </td>
                                    </tr>`;
                            }
                        }

                        html += `</tbody></table>`;
                        $('#result').html(html);
                        renderPagination(totalPages);
                    },
                    error: function () {
                        $('#result').html('<div class="alert alert-danger">상품 목록을 불러오는 데 실패했습니다.</div>');
                    }
                });
            }

            function renderPagination(totalPages) {
                let paginationHtml = `<nav><ul class="pagination justify-content-center mt-4">`;
                for (let i = 0; i < totalPages; i++) {
                    const active = i === currentPage ? 'active' : '';
                    paginationHtml += `
                        <li class="page-item ${active}">
                            <a class="page-link" href="?page=${i}&size=${size}&sort=${sort}">${i + 1}</a>
                        </li>`;
                }
                paginationHtml += `</ul></nav>`;
                $('#pagination').html(paginationHtml);
            }

            // 옵션 선택 시 수량 표시
            $('#result').on('change', '.optionSelect', function () {
                const quantity = $(this).val();
                const targetId = $(this).data('target');
                $('#' + targetId).text(quantity);
            });

            $('#result').on('click', '.deleteBtn', function () {
                const $btn = $(this);
                const productId = $btn.data('id');
                if (confirm('정말 삭제하시겠습니까?')) {
                    $btn.prop('disabled', true);
                    $.ajax({
                        url: `/api/products/${productId}`,
                        method: 'DELETE',
                        success: function () {
                            fetchProducts(currentPage);
                        },
                        error: function (jqXHR) {
                            let message = "상품 삭제 실패";
                            if (jqXHR.responseJSON) {
                                const errors = [];
                                const fieldErrors = jqXHR.responseJSON.fieldErrors;
                                const objectErrors = jqXHR.responseJSON.objectErrors;
                                if (fieldErrors) {
                                    for (const key in fieldErrors) errors.push(fieldErrors[key]);
                                }
                                if (objectErrors) {
                                    for (const err of objectErrors) errors.push(err.message);
                                }
                                if (errors.length > 0) message = errors.join('\n');
                            }
                            alert(message);
                        },
                        complete: function () {
                            $btn.prop('disabled', false);
                        }
                    });
                }
            });

            $('#result').on('click', '.editBtn', function () {
                const productId = $(this).data('id');
                window.location.href = `/admin/products/${productId}`;
            });

            $('#result').on('click', '.optionBtn', function () {
                const productId = $(this).data('id');
                window.location.href = `/admin/products/${productId}/options`;
            });

            fetchProducts(currentPage);
        });
    </script>
</head>

<body class="bg-light">
<div th:replace="~{fragments/header.html}"></div>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary fw-bold">상품 관리</h1>
        <a href="/admin/products/new" class="btn btn-success">상품 등록</a>
    </div>

    <hr>

    <div class="row mb-3">
        <div class="col-md-6">
            <label for="sortKey" class="form-label">정렬 기준</label>
            <select id="sortKey" class="form-select">
                <option value="id">ID</option>
                <option value="name">이름</option>
                <option value="price">가격</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="sortDir" class="form-label">정렬 방향</label>
            <select id="sortDir" class="form-select">
                <option value="asc">오름차순</option>
                <option value="desc">내림차순</option>
            </select>
        </div>
    </div>

    <hr>

    <div id="result"></div>
    <div id="pagination"></div>
</div>
</body>
</html>
