<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>옵션 수량 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script th:inline="javascript">
        $(document).ready(function () {
            const optionId = /*[[${optionId}]]*/ "1";
            const productId = /*[[${productId}]]*/ "1";

            // 옵션 정보 불러오기
            $.get(`/api/options/${optionId}`, function (option) {
                $('#optionName').val(option.name);
                $('#optionQuantity').val(option.quantity);
            });

            $('#updateBtn').on('click', function () {
                const quantity = parseInt($('#optionQuantity').val());

                if (isNaN(quantity) || quantity < 1) {
                    alert("수량은 1 이상이어야 합니다.");
                    return;
                }

                $.ajax({
                    url: `/api/options/${optionId}`,
                    method: 'PATCH',
                    contentType: 'application/json',
                    data: JSON.stringify(
                        {
                            quantity: quantity
                        }
                    ),
                    success: function () {
                        alert("옵션 수량이 수정되었습니다.");
                        window.location.href = `/admin/products/${productId}/options`;
                    },
                    error: function () {
                        alert("수정 실패");
                    }
                });
            });
        });
    </script>
</head>

<body class="bg-light">
<!-- 공통 헤더 포함 -->
<div th:replace="~{fragments/header.html}"></div>
<div class="container mt-5">
    <div class="card shadow-sm p-4">
        <h4 class="text-center text-primary mb-4">옵션 수량 수정</h4>

        <div class="mb-3">
            <label for="optionName" class="form-label">옵션 이름</label>
            <input type="text" id="optionName" class="form-control" disabled>
        </div>

        <div class="mb-4">
            <label for="optionQuantity" class="form-label">수량</label>
            <input type="number" id="optionQuantity" class="form-control" min="1">
        </div>

        <div class="d-grid">
            <button id="updateBtn" class="btn btn-success">수량 수정</button>
        </div>
    </div>
</div>
</body>
</html>
