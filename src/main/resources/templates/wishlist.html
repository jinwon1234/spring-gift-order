<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>나의 위시리스트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        function getQueryParam(name, defaultValue) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name) || defaultValue;
        }

        $(document).ready(function () {
            let currentPage = parseInt(getQueryParam('page', 0));
            const size = parseInt(getQueryParam('size', 10));
            const sort = getQueryParam('sort', 'id,asc');

            $('#sortKey').val(sort.split(',')[0]);
            $('#sortDir').val(sort.split(',')[1]);

            $('#sortKey, #sortDir').on('change', function () {
                const newSortKey = $('#sortKey').val();
                const newSortDir = $('#sortDir').val();

                const newUrl = new URL(window.location.href);
                newUrl.searchParams.set('page', 0);
                newUrl.searchParams.set('size', size);
                newUrl.searchParams.set('sort', `${newSortKey},${newSortDir}`);

                window.location.href = newUrl.toString();
            });

            function fetchWishProducts(page = 0) {
                $.ajax({
                    url: `/api/wish-products?page=${page}&size=${size}&sort=${sort}`,
                    method: 'GET',
                    success: function (data) {
                        const products = data.content;
                        const totalPages = data.page.totalPages;
                        currentPage = data.page.number;

                        let html = `
                            <table class="table table-striped table-hover mt-4">
                                <thead class="table-dark">
                                    <tr>
                                        <th>상품명</th>
                                        <th>옵션명</th>
                                        <th>가격</th>
                                        <th>이미지</th>
                                        <th>수량</th>
                                        <th>총 가격</th>
                                        <th>수정</th>
                                        <th>제거</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;
                        for (const product of products) {
                            html += `
                                <tr>
                                    <td>${product.productName}</td>
                                    <td>${product.optionName}</td>
                                    <td>${product.price.toLocaleString()}원</td>
                                    <td><img src="${product.imageUrl}" alt="img" width="60" height="60" class="rounded shadow-sm"></td>
                                    <td>${product.quantity}</td>
                                    <td>${(product.price * product.quantity).toLocaleString()}원</td>
                                    <td><button class="btn btn-warning btn-sm updateBtn" data-id="${product.id}" data-current="${product.quantity}">수량 수정</button></td>
                                    <td><button class="btn btn-danger btn-sm deleteBtn" data-id="${product.id}">제거</button></td>
                                </tr>
                            `;
                        }
                        html += `</tbody></table>`;
                        $('#result').html(html);

                        renderPagination(totalPages);
                    },
                    error: function () {
                        $('#result').html('<div class="alert alert-danger">위시리스트를 불러오는 데 실패했습니다.</div>');
                    }
                });
            }

            function renderPagination(totalPages) {
                let paginationHtml = `<nav><ul class="pagination">`;

                for (let i = 0; i < totalPages; i++) {
                    const active = i === currentPage ? 'active' : '';
                    paginationHtml += `
                        <li class="page-item ${active}">
                            <a class="page-link pageBtn" href="?page=${i}&size=${size}&sort=${sort}">${i + 1}</a>
                        </li>`;
                }

                paginationHtml += `</ul></nav>`;
                $('#pagination').html(paginationHtml);
            }

            $('#pagination').on('click', '.pageBtn', function (e) {
                // 새로고침 허용 (주소 반영)
            });

            $('#result').on('click', '.updateBtn', function () {
                const wishId = $(this).data('id');
                const currentQuantity = $(this).data('current');
                const input = prompt("새 수량을 입력하세요:", currentQuantity);
                const quantity = parseInt(input);

                $.ajax({
                    url: `/api/wish-products/${wishId}`,
                    method: 'PATCH',
                    contentType: 'application/json',
                    data: JSON.stringify({ quantity }),
                    success: function () {
                        alert('수량이 수정되었습니다.');
                        fetchWishProducts(currentPage);
                    },
                    error: (jqXHR) => {
                        let message = "위시 상품 수정 실패";
                        if (jqXHR.responseJSON) {
                            const errors = [];
                            const fieldErrors = jqXHR.responseJSON.fieldErrors;
                            const objectErrors = jqXHR.responseJSON.objectErrors;

                            if (fieldErrors) {
                                for (const key in fieldErrors) {
                                    errors.push(fieldErrors[key]);
                                }
                            }

                            if (objectErrors) {
                                for (const err of objectErrors) {
                                    errors.push(err.message);
                                }
                            }

                            if (errors.length > 0) {
                                message = errors.join('\n');
                            }
                        }
                        alert(message);
                    }
                });
            });

            $('#result').on('click', '.deleteBtn', function () {
                const wishId = $(this).data('id');
                if (confirm('정말 삭제하시겠습니까?')) {
                    $.ajax({
                        url: `/api/wish-products/${wishId}`,
                        method: 'DELETE',
                        success: function () {
                            fetchWishProducts(currentPage);
                        },
                        error: (jqXHR) => {
                            let msg = "위시 상품 삭제 실패";
                            if (jqXHR.responseJSON?.message) msg = jqXHR.responseJSON.message;
                            alert(msg);
                        }
                    });
                }
            });

            fetchWishProducts(currentPage);
        });
    </script>
</head>

<body class="bg-light">
<div th:replace="~{fragments/header.html}"></div>
<div class="container mt-5">
    <h1 class="text-center text-primary fw-bold mb-4">나의 위시리스트</h1>

    <hr>

    <div class="row mb-3">
        <div class="col-md-6">
            <label for="sortKey" class="form-label">정렬 기준</label>
            <select id="sortKey" class="form-select">
                <option value="id">ID</option>
                <option value="product.name">이름</option>
                <option value="product.price">가격</option>
                <option value="quantity">수량</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="sortDir" class="form-label">정렬 방향</label>
            <select id="sortDir" class="form-select">
                <option value="asc">오름차순</option>
                <option value="desc">내림차순</option>
            </select>
        </div>
    </div>

    <div id="result"></div>
    <div class="d-flex justify-content-center mt-3" id="pagination"></div>
</div>
</body>
</html>
