<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function () {
            $('#addOptionBtn').on('click', function () {
                const optionHtml = `
                    <div class="option-group row g-2 align-items-center mb-2">
                        <div class="col-md-5">
                            <input type="text" class="form-control option-name" placeholder="옵션 이름">
                        </div>
                        <div class="col-md-5">
                            <input type="number" class="form-control option-quantity" placeholder="수량">
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-outline-danger removeOptionBtn">삭제</button>
                        </div>
                    </div>`;
                $('#optionsContainer').append(optionHtml);
            });

            $(document).on('click', '.removeOptionBtn', function () {
                $(this).closest('.option-group').remove();
            });

            $('#createBtn').on('click', function () {
                const $btn = $(this);
                $btn.prop('disabled', true);

                const name = $('#nameInput').val();
                const price = parseInt($('#priceInput').val());
                const imageURL = $('#imageURLInput').val();

                const options = [];

                $('.option-group').each(function () {
                    const optionName = $(this).find('.option-name').val();
                    const quantity = parseInt($(this).find('.option-quantity').val());

                    if (optionName && quantity) {
                        options.push({ optionName, quantity });
                    }
                });

                const productData = {
                    name,
                    price,
                    imageURL,
                    options
                };

                $.ajax({
                    url: '/api/products',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(productData),
                    success: function () {
                        alert("상품 등록 완료!");
                        window.location.href = '/admin/products';
                    },
                    error: function (jqXHR) {
                        let message = "상품 등록 실패";
                        if (jqXHR.responseJSON) {
                            const errors = [];
                            const fieldErrors = jqXHR.responseJSON.fieldErrors;
                            const objectErrors = jqXHR.responseJSON.objectErrors;
                            const mesg = jqXHR.responseJSON.message;

                            if (fieldErrors) {
                                for (const key in fieldErrors) {
                                    errors.push(fieldErrors[key]);
                                }
                            }

                            if (objectErrors) {
                                for (const err of objectErrors) {
                                    errors.push(err.message);
                                }
                            }

                            if (mesg) {
                                errors.push(mesg)
                            }

                            if (errors.length > 0) {
                                message = errors.join('\n');
                            }
                        }
                        alert(message);
                    },
                    complete: function () {
                        $btn.prop('disabled', false);
                    }
                });
            });
        });
    </script>
</head>
<!-- 공통 헤더 포함 -->
<div th:replace="~{fragments/header.html}"></div>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="mb-4 text-success">상품 등록</h2>
    <div class="mb-3">
        <label for="nameInput" class="form-label">상품 이름</label>
        <input type="text" id="nameInput" class="form-control">
    </div>
    <div class="mb-3">
        <label for="priceInput" class="form-label">가격</label>
        <input type="number" id="priceInput" class="form-control">
    </div>
    <div class="mb-3">
        <label for="imageURLInput" class="form-label">이미지 URL</label>
        <input type="text" id="imageURLInput" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">옵션</label>
        <div id="optionsContainer">
            <!-- 기본 옵션 하나 추가 -->
            <div class="option-group row g-2 align-items-center mb-2">
                <div class="col-md-5">
                    <input type="text" class="form-control option-name" placeholder="옵션 이름">
                </div>
                <div class="col-md-5">
                    <input type="number" class="form-control option-quantity" placeholder="수량">
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-outline-danger removeOptionBtn">삭제</button>
                </div>
            </div>
        </div>
        <button type="button" id="addOptionBtn" class="btn btn-outline-secondary mt-2">옵션 추가</button>
    </div>

    <button id="createBtn" class="btn btn-success">상품 등록</button>
</div>
</body>
</html>
